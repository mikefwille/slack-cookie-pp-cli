# agentcookie.toml: secrets-bus adoption manifest v2
# See docs/spec-agentcookie-secrets-bus-v2-adoption.md
schema_version = 2
name = "slack-cookie-pp-cli"
display_name = "Slack (cookie auth)"
description = "Drive Slack from the terminal as yourself using your browser session, across all your separate-login workspaces, with offline sync and native Slack AI."
project_kind = "cli"

[secrets.file]
path = "~/.config/slack-cookie-pp-cli/config.toml"

[sync]
default = false

[sync.keys]
SLACK_XOXC_TOKEN = true
